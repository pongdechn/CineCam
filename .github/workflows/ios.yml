name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: CineCam-repo

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show repo files
        run: |
          { echo "== files =="; ls -la; echo; ls -R Sources || true; } 2>&1 | tee -a build.log

      - name: Install XcodeGen
        run: brew install xcodegen 2>&1 | tee -a build.log

      - name: Generate Xcode project
        run: xcodegen generate 2>&1 | tee -a build.log

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project CineCam.xcodeproj \
            -scheme CineCam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee -a build.log

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/CineCam.app Payload/
          zip -r CineCam.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CineCam-ipa
          path: CineCam-repo/CineCam.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: CineCam-repo/build.log
          if-no-files-found: warn
