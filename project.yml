name: CineCam
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CineCam:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cinecam
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: CineCam
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: CineCam needs the camera to record video.
        NSMicrophoneUsageDescription: CineCam needs the microphone to record audio.
        NSLocalNetworkUsageDescription: CineCam connects to your other iPhone on the same Wi-Fi.
        NSBonjourServices:
          - _cinecam._tcp
          - _cinecam._udp
